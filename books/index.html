<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STEO — Hardcopy Workbooks</title>

<!--
  ============================================================
  STEO Hardcopy Workbooks Page
  ============================================================
  Matches the home-page aesthetic exactly:
   - Drifting deep-navy gradient background
   - Slow pulsing aura glow behind content
   - Outfit (200) wordmark + Manrope body, wide tracking
   - Glass pill buttons with cursor-tracking radial highlight
   - Trailing cursor dot (desktop only)
   - Film grain overlay
   - Staggered fade-in on load, reduced-motion respected

  Served directly by GitHub Pages at /books/.
  The seven original Stripe payment links are preserved.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400&family=Manrope:wght@200;300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-deepest: #02060f;
    --bg-deep: #050d1f;
    --bg-mid: #0a1d3d;
    --ink: #ffffff;
    --ink-soft: #c5d8f5;
    --ink-faint: rgba(197, 216, 245, 0.55);
    --line: rgba(197, 216, 245, 0.45);
    --line-soft: rgba(197, 216, 245, 0.22);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: var(--bg-deepest);
    color: var(--ink);
    font-family: 'Manrope', -apple-system, sans-serif;
    font-weight: 300;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  @media (hover: hover) and (pointer: fine) {
    html, body { cursor: none; }
    a, button, .btn { cursor: none; }
  }

  /* ================ BACKGROUND ATMOSPHERE ================ */
  .stage {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    isolation: isolate;
    padding: clamp(48px, 8vh, 96px) 24px clamp(64px, 10vh, 120px);
  }
  .stage::before {
    content: '';
    position: absolute; inset: -10%;
    background:
      radial-gradient(ellipse 60% 55% at 50% 45%, var(--bg-mid) 0%, var(--bg-deep) 45%, var(--bg-deepest) 80%);
    z-index: -3;
    animation: drift 22s ease-in-out infinite alternate;
  }

  /* Pulsing aura glow centered on page */
  .glow {
    position: absolute;
    top: 50%; left: 50%;
    width: min(960px, 95vw);
    height: min(960px, 95vw);
    transform: translate(-50%, -50%);
    z-index: -2;
    pointer-events: none;
    filter: blur(28px);
  }
  .glow::before,
  .glow::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      rgba(140, 205, 255, 0.55) 0%,
      rgba(70, 145, 230, 0.28) 28%,
      rgba(20, 60, 130, 0.10) 55%,
      rgba(10, 30, 70, 0) 75%);
    animation: glow-pulse 9s ease-in-out infinite;
  }
  .glow::after {
    background: radial-gradient(circle at 50% 50%,
      rgba(190, 225, 255, 0.40) 0%,
      rgba(100, 180, 255, 0.20) 32%,
      rgba(20, 60, 130, 0) 65%);
    animation: glow-pulse 13s ease-in-out infinite reverse;
    transform: scale(1.18);
    filter: blur(20px);
  }

  /* Film grain */
  .grain {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 100;
    opacity: 0.06;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-2%, 2%) scale(1.05); }
  }
  @keyframes glow-pulse {
    0%, 100% { transform: scale(1);    opacity: 0.85; }
    50%      { transform: scale(1.10); opacity: 1;    }
  }

  /* ================ CONTENT ================ */
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 720px;
    margin: 0 auto;
  }

  /* Wordmark — links back to home */
  .wordmark {
    display: inline-block;
    font-family: 'Outfit', sans-serif;
    font-weight: 200;
    font-size: clamp(64px, 11vw, 140px);
    letter-spacing: 0.18em;
    color: var(--ink);
    text-decoration: none;
    line-height: 1;
    text-indent: 0.18em;          /* visually centers tracked text */
    opacity: 0;
    animation: rise 1.2s 0.15s cubic-bezier(.2,.7,.2,1) forwards;
    transition: opacity .4s ease, text-shadow .4s ease, transform .5s cubic-bezier(.2,.7,.2,1);
    will-change: transform, opacity;
  }
  .wordmark:hover {
    text-shadow:
      0 0 30px rgba(150, 210, 255, 0.55),
      0 0 60px rgba(95, 175, 255, 0.30);
  }

  .tagline {
    margin-top: clamp(14px, 2vh, 22px);
    font-family: 'Manrope', sans-serif;
    font-weight: 300;
    font-size: clamp(11.5px, 1.05vw, 14px);
    letter-spacing: 0.42em;
    color: var(--ink-soft);
    text-transform: uppercase;
    text-indent: 0.42em;
    opacity: 0;
    animation: rise 1.2s 0.55s cubic-bezier(.2,.7,.2,1) forwards;
  }

  /* ============ BUTTON STACK ============ */
  .actions {
    margin-top: clamp(48px, 7vh, 88px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 2vh, 20px);
    width: 100%;
  }
  .actions > * { opacity: 0; }

  /* Staggered reveals — each button rises slightly after the previous */
  .actions > *:nth-child(1) { animation: rise 1.0s 0.95s cubic-bezier(.2,.7,.2,1) forwards; }
  .actions > *:nth-child(2) { animation: rise 1.0s 1.05s cubic-bezier(.2,.7,.2,1) forwards; }
  .actions > *:nth-child(3) { animation: rise 1.0s 1.15s cubic-bezier(.2,.7,.2,1) forwards; }
  .actions > *:nth-child(4) { animation: rise 1.0s 1.25s cubic-bezier(.2,.7,.2,1) forwards; }
  .actions > *:nth-child(5) { animation: rise 1.0s 1.35s cubic-bezier(.2,.7,.2,1) forwards; }
  .actions > *:nth-child(6) { animation: rise 1.0s 1.45s cubic-bezier(.2,.7,.2,1) forwards; }
  .actions > *:nth-child(7) { animation: rise 1.0s 1.55s cubic-bezier(.2,.7,.2,1) forwards; }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 18px 44px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    font-weight: 400;
    font-size: 12.5px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    text-decoration: none;
    text-indent: 0.32em;
    overflow: hidden;
    transition: transform .35s cubic-bezier(.2,.7,.2,1),
                border-color .4s ease,
                background .4s ease,
                box-shadow .4s ease,
                color .4s ease;
    min-width: 280px;
  }
  .btn::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%),
      rgba(150, 210, 255, 0.35), rgba(150, 210, 255, 0) 60%);
    opacity: 0;
    transition: opacity .4s ease;
    pointer-events: none;
  }
  .btn:hover {
    border-color: rgba(220, 235, 255, 0.85);
    background: rgba(255, 255, 255, 0.08);
    box-shadow:
      0 0 0 1px rgba(150, 210, 255, 0.25) inset,
      0 8px 40px -8px rgba(95, 175, 255, 0.55);
    transform: translateY(-2px);
  }
  .btn:hover::before { opacity: 1; }
  .btn:active { transform: translateY(0); }

  /* ============ KEYFRAMES ============ */
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============ CLICK RIPPLES (CANVAS) ============ */
  .ripple-canvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 50;
    /* No blend mode — ripples render with normal alpha compositing */
  }

  /* ============ TRAILING CURSOR ============ */
  .cursor-core {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    will-change: transform, width, height;
    width: 6px; height: 6px;
    background: rgba(220, 235, 255, 0.95);
    box-shadow: 0 0 12px rgba(150, 210, 255, 0.7);
    transition: width .25s ease, height .25s ease, background .25s ease;
  }
  body.is-hovering .cursor-core { width: 10px; height: 10px; }
  @media (hover: none), (pointer: coarse) {
    .cursor-core { display: none; }
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 520px) {
    .stage { padding: 64px 18px 80px; }
    .btn { min-width: 240px; padding: 16px 32px; font-size: 11.5px; letter-spacing: 0.28em; }
    .tagline { letter-spacing: 0.36em; font-size: 11px; }
  }

  /* ============ REDUCED MOTION ============ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    .wordmark, .tagline, .actions > * { opacity: 1 !important; }
  }
</style>
</head>

<body>

<div class="stage">
  <div class="glow" aria-hidden="true"></div>

  <main class="content">
    <a class="wordmark" href="/" aria-label="STEO — back to home">STEO</a>
    <p class="tagline">Hardcopy Workbooks</p>

    <nav class="actions" aria-label="Workbook collection">
      <a class="btn" href="https://buy.stripe.com/6oUaEZ3G14xAeqT78d8Zq02" target="_blank" rel="noopener">Health Workbook</a>
      <a class="btn" href="https://buy.stripe.com/6oU4gBa4pfceciL8ch8Zq04" target="_blank" rel="noopener">Sex Workbook</a>
      <a class="btn" href="https://buy.stripe.com/14A3cxgsN3tweqT78d8Zq07" target="_blank" rel="noopener">Money Workbook</a>
      <a class="btn" href="https://buy.stripe.com/eVq28t90l2ps0A36498Zq03" target="_blank" rel="noopener">Love Workbook</a>
      <a class="btn" href="https://buy.stripe.com/dRmeVf0tP4xA96z78d8Zq06" target="_blank" rel="noopener">Power Workbook</a>
      <a class="btn" href="https://buy.stripe.com/4gMaEZdgBd46eqTfEJ8Zq09" target="_blank" rel="noopener">Purpose Workbook</a>
      <a class="btn" href="https://buy.stripe.com/aFacN76Sd6FI4QjgIN8Zq08" target="_blank" rel="noopener">Happiness Workbook</a>
    </nav>
  </main>
</div>

<div class="grain" aria-hidden="true"></div>

<canvas class="ripple-canvas" id="ripples" aria-hidden="true"></canvas>

<div class="cursor-core" aria-hidden="true"></div>

<script>
(function () {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fineCursor   = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  // Per-button cursor highlight tracking
  document.querySelectorAll('.btn').forEach(btn => {
    btn.addEventListener('mousemove', (e) => {
      const r = btn.getBoundingClientRect();
      btn.style.setProperty('--mx', ((e.clientX - r.left) / r.width  * 100) + '%');
      btn.style.setProperty('--my', ((e.clientY - r.top)  / r.height * 100) + '%');
    });
  });

  // Trailing cursor (desktop, fine-pointer only)
  if (fineCursor && !reduceMotion) {
    const core = document.querySelector('.cursor-core');
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;
    let cx = mx, cy = my;

    window.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });

    function tick() {
      cx += (mx - cx) * 0.55;
      cy += (my - cy) * 0.55;
      core.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
      requestAnimationFrame(tick);
    }
    tick();

    document.querySelectorAll('a, button, .btn').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('is-hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('is-hovering'));
    });
  }
})();

/* =========================================================
   Canvas-based click ripples — gentle still-lake feel
   - One main ripple + one soft echo per click
   - Slow expansion, very low opacity
   - Normal alpha compositing (no blend mode)
   ========================================================= */
(function () {
  const cvs = document.getElementById('ripples');
  if (!cvs) return;
  const ctx = cvs.getContext('2d');
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  function resize() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    cvs.width  = window.innerWidth  * dpr;
    cvs.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const ripples = [];
  const MAX_LIFE = 3800;     // ms — slow, drawn-out
  const MAX_R    = 460;      // px — peak radius

  function drop(x, y, delay = 0, strength = 1) {
    setTimeout(() => {
      ripples.push({
        x, y,
        t0: performance.now(),
        life: MAX_LIFE,
        maxR: MAX_R * (0.9 + Math.random() * 0.2),
        strength
      });
    }, delay);
  }

  function isInteractive(el) {
    return el.closest && el.closest('a, button, .btn, input, textarea, select');
  }

  window.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (isInteractive(e.target)) return;
    drop(e.clientX, e.clientY, 0,   1.0);   // main drop
    drop(e.clientX, e.clientY, 380, 0.45);  // single soft echo
  });

  window.addEventListener('touchstart', (e) => {
    if (isInteractive(e.target)) return;
    const t = e.touches[0]; if (!t) return;
    drop(t.clientX, t.clientY, 0,   1.0);
    drop(t.clientX, t.clientY, 380, 0.45);
  }, { passive: true });

  function render() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    const now = performance.now();

    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      const t = (now - r.t0) / r.life;          // 0 → 1
      if (t >= 1) { ripples.splice(i, 1); continue; }

      // Slow ease-out expansion
      const radius = r.maxR * (1 - Math.pow(1 - t, 2.6));
      // Gentle fade — eases in then drifts out
      const fade   = Math.sin(t * Math.PI) * (1 - t * 0.3);
      const alpha  = 0.14 * fade * r.strength;  // peak ~0.14, very low

      // Single soft ring — no halo, no additive blend
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200, 225, 255, ${alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    requestAnimationFrame(render);
  }
  render();
})();
</script>

</body>
</html>
